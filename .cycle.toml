[repo]
name = "emporiad"
forge = "https://forgejo.wg"
owner = "hughobrien"

[test]
fast_stages = [
  "drift=$(gofmt -l . | grep -v '^vendor/' || true); [ -z \"$drift\" ] || { echo \"gofmt drift: $drift\"; exit 1; }",
  "go vet ./...",
  "go test ./...",
  "find . -path './.worktrees' -prune -o -name '*.nix' -exec nixfmt --check {} +",
  "statix check .",
  "deadnix --fail .",
  "actionlint -config-file \"$ACTIONLINT_CONFIG\" .forgejo/workflows/*.yml",
  "rumdl check --disable MD013 --no-cache --exclude docs/superpowers .",
]
slow_stages = [
  "go test -race ./...",
]

[ci]
required_contexts = ["ci / gate (pull_request)"]
main_workflows = ["ci.yml"]
tofu_plan = "none"
